<style>
:root{
  --paper:#F6F0E6; --paper2:#EFE6D8; --ink:#1B2836; --ink2:#3C4A5A; --mute:#7C8794; --line:rgba(27,40,54,.12);
  --coral:#D4472F; --sea:#2E86AB; --teal:#2AA198; --amber:#E8A33D; --orange:#E07A2E; --plum:#B23A8F; --green:#6FA35B; --gold:#C9A227; --navy:#1B4F72; --grey:#8A8F98;
  --night:#0F141C; --night2:#161D28; --nightink:#F3EEE6; --nightmute:#93A0AF; --nightline:rgba(255,255,255,.1);
  --disp:'Barlow Condensed',Impact,sans-serif; --body:'Barlow',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --panelW:400px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--paper);overflow:hidden;-webkit-font-smoothing:antialiased}
body.night{color:var(--nightink);background:var(--night)}

/* ---------- top bar ---------- */
.top{position:fixed;left:0;right:0;top:0;height:56px;z-index:1200;display:flex;align-items:center;gap:14px;padding:0 14px;overflow:hidden;
  background:rgba(246,240,230,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body.night .top{background:rgba(15,20,28,.9);border-bottom-color:var(--nightline)}
.brand{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--mute);font-weight:400}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px 2px}
.days::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--ink2);font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:7px 10px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.chip b{font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:0;margin-left:3px;color:var(--coral)}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.on b{color:#FFB39F}
body.night .chip{color:var(--nightmute);border-color:var(--nightline)}
body.night .chip.on{background:var(--nightink);color:var(--night);border-color:var(--nightink)}
body.night .chip.on b{color:var(--coral)}
.phase{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.phase button{border:0;background:transparent;color:var(--ink2);font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:7px 11px;cursor:pointer}
.phase button.on{background:var(--ink);color:#fff}
body.night .phase{border-color:var(--nightline)}
body.night .phase button{color:var(--nightmute)}
body.night .phase button.on{background:var(--nightink);color:var(--night)}

/* ---------- map ---------- */
#map{position:fixed;inset:56px 0 0 var(--panelW);z-index:1;background:#dfe9ee}
body.night #map{background:#0b0f15}
.leaflet-container{font-family:var(--body)}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7)!important}
body.night .leaflet-control-attribution{background:rgba(15,20,28,.7)!important;color:#aaa}
body.night .leaflet-control-attribution a{color:#ccc}
.leaflet-bar a{background:var(--paper);color:var(--ink);border-bottom-color:var(--line)}
body.night .leaflet-bar a{background:var(--night2);color:var(--nightink);border-bottom-color:var(--nightline)}

/* markers */
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .15s}
.pin svg{transform:rotate(45deg);width:15px;height:15px;fill:#fff}
.pin.dim{opacity:.35}
.pin.hl{transform:rotate(-45deg) scale(1.25);z-index:999}
.pin.base{background:var(--coral);width:36px;height:36px}
.pin.base svg{width:19px;height:19px}
.pin.beach{background:var(--sea)}
.pin.night{background:#6C3FA0}
.pin.eat{background:var(--amber)}
.pin.stop{background:var(--ink);width:22px;height:22px;border-radius:50%;transform:none;border-width:2px}
.pin.stop svg{transform:none;width:12px;height:12px}
.pin.stop.hl{transform:scale(1.3)}
.pin.port{background:var(--navy);width:24px;height:24px;border-radius:50%;transform:none}
.pin.port svg{transform:none;width:13px;height:13px}
.pin.port.hl{transform:scale(1.3)}
.pin.air{background:var(--green)}
.pin.sight{background:var(--teal)}
.pin.town{background:var(--plum)}
.pin.stop.dim,.pin.port.dim{opacity:.3}
body.z-low .pin.stop{display:none}
body.z-vlow .pin.eat,body.z-vlow .pin.stop,body.z-vlow .pin.port{display:none}
body.night .pin{border-color:#1b2230}
.leaflet-tooltip.lbl{background:rgba(27,40,54,.92);color:#fff;border:0;border-radius:4px;font-family:var(--body);font-size:12px;font-weight:600;padding:4px 8px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.leaflet-tooltip.lbl::before{border-top-color:rgba(27,40,54,.92)}
body.night .leaflet-tooltip.lbl{background:rgba(243,238,230,.95);color:var(--night)}
body.night .leaflet-tooltip.lbl::before{border-top-color:rgba(243,238,230,.95)}
.leaflet-popup-content-wrapper{border-radius:8px;background:var(--paper);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:var(--body)}
.leaflet-popup-tip{background:var(--paper)}
body.night .leaflet-popup-content-wrapper,body.night .leaflet-popup-tip{background:var(--night2);color:var(--nightink)}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.45;min-width:180px}
.pop h4{font-family:var(--disp);font-size:18px;font-weight:700;line-height:1;margin-bottom:3px;text-transform:uppercase}
.pop .cat{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin-bottom:6px}
.pop p{color:var(--ink2);font-size:12.5px}
body.night .pop p{color:var(--nightmute)}
.pop .dz{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
.pop .dz span{font-family:var(--mono);font-size:10px;padding:2px 6px;border:1px solid var(--line);border-radius:3px}
body.night .pop .dz span{border-color:var(--nightline)}
.pop .co{font-family:var(--mono);font-size:10px;color:var(--mute);margin-top:6px}

/* ---------- side panel ---------- */
.panel{position:fixed;left:0;top:56px;bottom:0;width:var(--panelW);z-index:1100;background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
body.night .panel{background:var(--night);border-right-color:var(--nightline)}
.panel::-webkit-scrollbar{width:8px}
.panel::-webkit-scrollbar-thumb{background:rgba(120,120,120,.35);border-radius:4px}
.ph{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
body.night .ph{border-bottom-color:var(--nightline)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--coral);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--coral)}
.ph h1{font-family:var(--disp);font-weight:800;font-size:34px;line-height:.95;text-transform:uppercase;margin-top:8px;letter-spacing:.005em}
.ph h1 em{font-style:normal;color:var(--coral)}
.ph .lede{margin-top:9px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
body.night .ph .lede{color:var(--nightmute)}
.stat{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.stat div{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--mute)}
.stat div b{display:block;font-family:var(--disp);font-size:20px;letter-spacing:0;color:var(--ink);font-weight:700;line-height:1.05;margin-top:2px}
body.night .stat div b{color:var(--nightink)}

.sec{padding:14px 20px 8px}
.sec h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sec h3 span{font-family:var(--mono);color:var(--mute);letter-spacing:.05em;text-transform:none;font-size:10px}

/* legs */
.leg{position:relative;display:grid;grid-template-columns:52px 1fr;gap:12px;padding:11px 10px 11px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:.15s}
.leg:hover{background:rgba(27,40,54,.045)}
body.night .leg:hover{background:rgba(255,255,255,.05)}
.leg.on{background:rgba(212,71,47,.08);border-color:rgba(212,71,47,.35)}
body.night .leg.on{background:rgba(212,71,47,.16)}
.leg.dimmed{opacity:.35}
.leg .t{font-family:var(--mono);font-size:11px;color:var(--mute);padding-top:3px;line-height:1.3}
.leg .t small{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);opacity:.8}
.leg .h{font-size:14px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.leg .h .ln{font-family:var(--disp);font-size:12px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--ink);padding:2px 6px;border-radius:3px;line-height:1.2}
.leg .h .md{font-size:13px}
.leg .r{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
body.night .leg .r{color:var(--nightmute)}
.leg .r b{color:var(--ink);font-weight:600}
body.night .leg .r b{color:var(--nightink)}
.leg .fx{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.fx span{font-family:var(--mono);font-size:10px;letter-spacing:.03em;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--ink2);white-space:nowrap}
.fx span.hot{border-color:rgba(212,71,47,.45);color:var(--coral)}
.fx span.ok{border-color:rgba(111,163,91,.5);color:#4E8A3C}
body.night .fx span{border-color:var(--nightline);color:var(--nightmute)}
body.night .fx span.hot{color:#FF8E76;border-color:rgba(255,142,118,.4)}
body.night .fx span.ok{color:#9BD08A}
.leg .alt{margin-top:7px;font-size:12px;color:var(--mute);border-left:2px solid var(--line);padding-left:8px;line-height:1.45}
.leg .walkinfo{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:4px}

/* place list */
.pl{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:6px;cursor:pointer;transition:.12s}
.pl:hover{background:rgba(27,40,54,.045)}
body.night .pl:hover{background:rgba(255,255,255,.05)}
.pl .dot{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
body.night .pl .dot{border-color:#1b2230}
.pl .nm{font-size:13.5px;font-weight:600;flex:1;line-height:1.25}
.pl .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--mute);margin-top:1px}
.pl .dist{font-family:var(--mono);font-size:10px;color:var(--mute);white-space:nowrap}

/* callouts */
.call{margin:8px 20px 12px;padding:12px 14px;border-radius:8px;border:1px solid rgba(212,71,47,.35);border-left:3px solid var(--coral);background:rgba(212,71,47,.06);font-size:12.5px;line-height:1.5;color:var(--ink2)}
.call.info{border-color:rgba(46,134,171,.35);border-left-color:var(--sea);background:rgba(46,134,171,.06)}
.call.ok{border-color:rgba(111,163,91,.4);border-left-color:var(--green);background:rgba(111,163,91,.07)}
.call b{color:var(--ink)}
.call .ct{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--coral);margin-bottom:5px}
.call.info .ct{color:var(--sea)}.call.ok .ct{color:#4E8A3C}
body.night .call{color:var(--nightmute)}
body.night .call b{color:var(--nightink)}

/* legend */
.lg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.lg div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
body.night .lg div{color:var(--nightmute)}
.lg i{width:22px;height:0;border-top:3px solid;flex:none;border-radius:2px}
.lg i.dash{border-top-style:dashed}
.lg i.dot{border-top-style:dotted}
.lines{display:flex;flex-direction:column;gap:6px}
.lnrow{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;padding:8px 8px;border-radius:6px;cursor:pointer}
.lnrow:hover{background:rgba(27,40,54,.045)}
body.night .lnrow:hover{background:rgba(255,255,255,.05)}
.lnrow .b{font-family:var(--disp);font-weight:800;font-size:14px;letter-spacing:.05em;color:#fff;padding:3px 0;text-align:center;border-radius:3px}
.lnrow .d{font-size:12.5px;line-height:1.4;color:var(--ink2)}
.lnrow .d b{color:var(--ink);font-weight:600;display:block}
body.night .lnrow .d{color:var(--nightmute)}
body.night .lnrow .d b{color:var(--nightink)}
.lnrow .d small{font-family:var(--mono);font-size:10px;color:var(--mute)}

.foot{padding:16px 20px 28px;font-size:11px;line-height:1.5;color:var(--mute);border-top:1px solid var(--line);margin-top:10px}
body.night .foot{border-top-color:var(--nightline)}
.foot a{color:inherit}

/* mobile: bottom sheet */
.grab{display:none}
@media (max-width:860px){
  :root{--panelW:0px}
  .top{height:100px;flex-wrap:wrap;padding:6px 10px 4px;gap:8px 10px;align-content:center}
  .brand{order:1;font-size:20px}
  .phase{order:2;margin-left:auto}
  .days{order:3;flex-basis:100%;width:100%;min-width:0;padding:2px 0 4px}
  #map{inset:100px 0 46vh 0}
  .panel{top:auto;bottom:0;left:0;right:0;width:auto;height:46vh;border-right:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transition:height .25s}
  .panel.tall{height:82vh}
  .grab{display:block;position:sticky;top:0;z-index:5;background:inherit;padding:8px 0 4px;text-align:center;cursor:pointer}
  .grab i{display:inline-block;width:40px;height:4px;border-radius:2px;background:rgba(120,120,120,.5)}
  .brand small{display:none}
  .ph h1{font-size:28px}
}
</style>
</head>
<body>

<div class="top">
  <div class="brand">Ibiza <span style="color:var(--coral)">Atlas</span><small>02–09 SEP 26</small></div>
  <div class="days" id="days"></div>
  <div class="phase" id="phase">
    <button data-p="all" class="on">ALL</button>
    <button data-p="day">☀ DAY</button>
    <button data-p="night">☾ NIGHT</button>
  </div>
</div>

<aside class="panel" id="panel">
  <div class="grab" id="grab"><i></i></div>
  <div id="pbody"></div>
</aside>
<div id="map"></div>

// helper: distance
const R_E=6371000;
function hav(a,b){const toR=Math.PI/180;const dLat=(b[0]-a[0])*toR,dLon=(b[1]-a[1])*toR;const s=Math.sin(dLat/2)**2+Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dLon/2)**2;return 2*R_E*Math.asin(Math.sqrt(s));}
const ll=id=>[P[id][2],P[id][3]];
const walkTxt=(a,b)=>{const m=hav(ll(a),ll(b));return `${m<950?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km'} · ${Math.max(1,Math.round(m/80))} min on foot`;};
const rev=a=>a.slice().reverse();
const seg=(id,fromIdx,toIdx)=>ROUTES[id].slice(fromIdx,toIdx);

const CATLBL={base:'Base camp',beach:'Beach',night:'Night',eat:'Food & drink',stop:'Bus stop',port:'Boat / ferry',air:'Airport',sight:'Sight',town:'Old town'};
const CATCOL={base:'#D4472F',beach:'#2E86AB',night:'#6C3FA0',eat:'#E8A33D',stop:'#1B2836',port:'#1B4F72',air:'#6FA35B',sight:'#2AA198',town:'#B23A8F'};

const markers={};
for(const id in P){
  const [name,cat,lat,lon,note,area]=P[id];
  const icon=L.divIcon({className:'',html:`<div class="pin ${cat}" data-id="${id}"><svg viewBox="0 0 24 24">${ICON[cat]}</svg></div>`,iconSize:cat==='stop'?[22,22]:cat==='port'?[24,24]:cat==='base'?[36,36]:[30,30],iconAnchor:cat==='stop'?[11,11]:cat==='port'?[12,12]:cat==='base'?[18,36]:[15,30],popupAnchor:[0,cat==='stop'||cat==='port'?-10:-28]});
  const m=L.marker([lat,lon],{icon,riseOnHover:true,zIndexOffset:cat==='base'?1000:(cat==='stop'?-100:0)});
  m.bindTooltip(name,{className:'lbl',direction:'top',offset:[0,cat==='stop'||cat==='port'?-8:-26]});
  m.on('click',()=>{ openPop(id); });
  markers[id]=m;
}
function daysFor(id){return DAYS.filter(d=>d.places&&d.places.includes(id)).map(d=>d.chip+' '+d.b);}
function openPop(id){
  const [name,cat,lat,lon,note,area]=P[id];
  const dz=daysFor(id);
  const html=`<div class="pop"><div class="cat">${CATLBL[cat]} · ${area}</div><h4>${name}</h4><p>${note}</p>${dz.length?`<div class="dz">${dz.map(x=>`<span>${x}</span>`).join('')}</div>`:''}<div class="co">${lat.toFixed(5)}, ${lon.toFixed(5)}</div></div>`;
  markers[id].bindPopup(html,{maxWidth:280}).openPopup();
}

const layerMarkers=L.layerGroup().addTo(map);
const layerRoutes=L.layerGroup().addTo(map);
let state={day:'ov',phase:'all',activeLeg:null};

function lineStyle(line,strong){
  const L_=LINE[line]||LINE.WALK;
  return {color:L_.c,weight:strong?6:4,opacity:strong?.95:.7,dashArray:L_.dash||null,lineCap:'round',lineJoin:'round'};
}
function addRoute(coords,line,strong,onclick){
  // white halo for legibility
  const halo=L.polyline(coords,{color:document.body.classList.contains('night')?'#0F141C':'#fff',weight:strong?10:7,opacity:.85,lineCap:'round',lineJoin:'round'});
  const pl=L.polyline(coords,lineStyle(line,strong));
  halo.addTo(layerRoutes);pl.addTo(layerRoutes);
  if(onclick){pl.on('click',onclick);halo.on('click',onclick);}
  return pl;
}

function render(){
  const day=DAYS.find(d=>d.id===state.day);
  layerMarkers.clearLayers();layerRoutes.clearLayers();
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.id===state.day));
  const pb=document.getElementById('pbody');
  if(day.id==='ov'){renderOverview(pb);}
  else{renderDay(pb,day);}
  document.getElementById('panel').scrollTop=0;
  setTimeout(zoomClass,50);
}

/* ---------- overview ---------- */
function renderOverview(pb){
  // all markers
  const ids=Object.keys(P);
  ids.forEach(id=>markers[id].addTo(layerMarkers));
  // all lines faint
  const lines=[['AERO1','AERO1'],['T1D1','T1'],['D3','D3'],['P4','P4'],['P5','P5'],['P7','P7'],['P2','P2'],['L3','L3'],['FERRY','FERRY'],['BOAT_SALADA','BOAT'],['BOAT_BASSA','BOAT']];
  lines.forEach(([rid,ln])=>addRoute(ROUTES[rid],ln,false));
  map.fitBounds([[38.72,1.19],[39.02,1.46]],{paddingTopLeft:[10,10],paddingBottomRight:[10,10]});
  const cats=['base','beach','night','eat','sight','town','port','stop','air'];
  const groups=cats.map(c=>({c,items:ids.filter(id=>P[id][1]===c)}));
  pb.innerHTML=`
    <div class="ph"><div class="eyebrow">Overview · every place, every line</div>
      <h1>The whole week, <em>on one map</em></h1>
      <p class="lede">Everything the itinerary touches: base camp, beaches, the four big rooms, the restaurants and the stops that get you between them. Pick a date above to see just that day — buses out, buses back, and what to do when the last one has gone.</p>
      <div class="stat"><div>Nights<b>7</b></div><div>Places<b>${ids.length}</b></div><div>Bus lines<b>9</b></div><div>Big rooms<b>4</b></div></div>
    </div>
    <div class="sec"><h3>Lines on the map <span>tap to isolate</span></h3><div class="lines" id="lines"></div></div>
    <div class="call info"><div class="ct">Read this before you Google anything</div>On 1 April 2026 Ibiza scrapped its whole bus system. ALSA took over and every old line number was replaced with letters: <b>T</b> trunk, <b>P</b> beach, <b>D</b> disco, <b>AERO</b> airport, <b>A / U</b> local. Every older guide — and the hotel's own website — still shows the old numbers. Tap a contactless card on board: card and QR fares are ~30% cheaper than cash.</div>
    <div class="sec"><h3>Legend</h3><div class="lg">${cats.map(c=>`<div><span class="dot" style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${CATCOL[c]};border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)"></span>${CATLBL[c]}</div>`).join('')}</div></div>
    ${groups.map(g=>`<div class="sec"><h3>${CATLBL[g.c]} <span>${g.items.length}</span></h3>${g.items.map(id=>plRow(id,true)).join('')}</div>`).join('')}
    <div class="foot">Coordinates from OpenStreetMap (via Google BigQuery's public OSM dataset — bus stops, beaches, clubs, terminals) and Google Maps place lookups (restaurants and bars), pulled 13 Aug 2026. Bus routes are road-routed between the real stops; sea routes are indicative. Timings mirror the itinerary and ALSA's 2026 timetables — re-check <a href="https://www.alsaibiza.es/en/schedules">alsaibiza.es</a> the week before.</div>`;
  const ln=document.getElementById('lines');
  const LNS=[['AERO1','Airport ↔ Sant Antoni','Every 30 min · 50 min · €4.00 card / €5.60 cash · last from the airport 01:30','AERO1'],
    ['T1','Sant Antoni ↔ Sant Rafel ↔ Port d\'Eivissa','Every 15 min Mon–Sat, 30 min Sun · 45 min · €1.85–2.60 · last back 23:20 (23:15 Sun)','T1D1'],
    ['D1','Discobus → Sant Rafel (Amnesia, UNVRS) → Ibiza port','Every 30 min · 23:30–06:30 daily · €3.00 / €4.20 cash · 13 min to Sant Rafel','T1D1'],
    ['D3','Discobus → Platja d\'en Bossa (Ushuaïa, Hï)','From 16:00 to 06:47 · ≈47 min · €4.00 / €5.60 cash','D3'],
    ['P4','Sant Antoni ↔ Cala de Bou ↔ Platges de Comte','35 min · 1 Jun–30 Sep · last back 21:45 (Cala de Bou 21:57, Sant Antoni 22:20)','P4'],
    ['P5','Sant Antoni ↔ Cala de Bou ↔ Cala Bassa','34 min · 1 Jun–30 Sep · last back 21:00 (Cala de Bou 21:10, Sant Antoni 21:33)','P5'],
    ['P7','Sant Antoni ↔ Cala Salada','Every 15 min · 15 min · ≈€1.90 · last back 20:50 · new for 2026','P7'],
    ['P2','Sant Antoni ↔ the bay road ↔ Port des Torrent','Hourly · your local · last out of Sant Antoni 23:30 — then a ≈€8 taxi','P2'],
    ['L3','La Savina ↔ Ses Illetes (Formentera)','7 round trips · 10 min · €10 return · last off the beach 18:45','L3'],
    ['FERRY','Ibiza port ↔ La Savina','Every 20–30 min · 25–35 min · ≈€40–60 return · last back depends on operator','FERRY'],
    ['BOAT','Sant Antoni boats','Cala Salada (Sea Experience, €9 return, back 13:00/16:00/18:00) · Cala Bassa (Cruceros Portmany, 3 sailings)','BOAT_SALADA']];
  ln.innerHTML=LNS.map(([k,d,f,rid])=>`<div class="lnrow" data-r="${rid}" data-l="${k}"><div class="b" style="background:${LINE[k].c}">${k}</div><div class="d"><b>${d}</b>${f}</div></div>`).join('');
  ln.querySelectorAll('.lnrow').forEach(r=>r.addEventListener('click',()=>{
    layerRoutes.clearLayers();
    const rid=r.dataset.r,k=r.dataset.l;
    let coords=ROUTES[rid]; if(k==='BOAT'){addRoute(ROUTES.BOAT_BASSA,'BOAT',true);}
    const pl=addRoute(coords,k,true);
    map.fitBounds(pl.getBounds(),{padding:[40,40]});
    ln.querySelectorAll('.lnrow').forEach(x=>x.style.opacity=x===r?1:.45);
  }));
  pb.querySelectorAll('.pl').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.id;map.flyTo(ll(id),Math.max(map.getZoom(),15),{duration:.8});setTimeout(()=>openPop(id),850);}));
}
function plRow(id,showDist){
  const [name,cat,lat,lon,note,area]=P[id];
  const d=hav(ll('hotel'),[lat,lon]);
  const dist=id==='hotel'?'base':(d<1200?`${Math.round(d/10)*10} m walk`:`${(d/1000).toFixed(1)} km`);
  return `<div class="pl" data-id="${id}"><span class="dot" style="background:${CATCOL[cat]}"></span><div class="nm">${name}<small>${area}</small></div>${showDist?`<span class="dist">${dist}</span>`:''}</div>`;
}

/* ---------- day ---------- */
const MODEICON={bus:'🚌',ferry:'⛴',boat:'⛵',walk:'🚶',taxi:'🚕',plane:'✈'};
function renderDay(pb,day){
  const legs=day.legs.filter(l=>state.phase==='all'||l.ph===state.phase);
  // markers for the day's places (phase-filtered: places referenced by visible legs, plus always the hotel)
  const vis=new Set(['hotel']);
  legs.forEach(l=>{vis.add(l.from);vis.add(l.to);if(l.altfrom)vis.add(l.altfrom);if(l.altto)vis.add(l.altto);});
  day.places.forEach(id=>{ if(state.phase==='all'||vis.has(id)) markers[id].addTo(layerMarkers); });
  // routes
  legs.forEach((l,i)=>{
    if(l.geom){l._pl=addRoute(l.geom,l.line,false,()=>selectLeg(i));}
    else if(l.mode==='walk'&&l.from!==l.to){l._pl=addRoute([ll(l.from),ll(l.to)],'WALK',false,()=>selectLeg(i));}
    if(l.altgeom){l._alt=addRoute(l.altgeom,'TAXI',false,()=>selectLeg(i));}
  });
  // fit
  const pts=[];day.places.forEach(id=>{if(state.phase==='all'||vis.has(id))pts.push(ll(id));});
  legs.forEach(l=>{if(l.geom)pts.push(...l.geom);});
  if(pts.length)map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[30,30],paddingBottomRight:[30,30],maxZoom:15});
  // panel
  const stops=day.places.filter(id=>P[id][1]==='stop'||P[id][1]==='port'||P[id][1]==='air');
  pb.innerHTML=`
    <div class="ph"><div class="eyebrow">${day.eyebrow}</div><h1>${day.title}</h1><p class="lede">${day.lede}</p>
      <div class="stat"><div>Sunset<b>${day.sunset}</b></div><div>Legs<b>${legs.length}</b></div><div>Big room<b>${day.legs.some(l=>/★/.test(l.h))?'★ yes':'—'}</b></div></div></div>
    <div class="sec"><h3>Logistics · to and from the hotel <span>tap a leg to trace it</span></h3><div id="legs">${legs.map((l,i)=>legRow(l,i)).join('')}</div></div>
    ${(day.calls||[]).map(c=>`<div class="call ${c.k}"><div class="ct">${c.t}</div>${c.b}</div>`).join('')}
    <div class="sec"><h3>Stops, ports &amp; hubs today <span>walk from hotel</span></h3>${stops.map(id=>plRow(id,true)).join('')}</div>
    <div class="sec"><h3>Places today</h3>${day.places.filter(id=>!stops.includes(id)).map(id=>plRow(id,true)).join('')}</div>
    <div class="foot">Times mirror the itinerary (ALSA 2026 timetables). Bus lines are drawn along the road between the real stops; boat and ferry lines are indicative. Walking times assume ~80 m/min.</div>`;
  pb.querySelectorAll('.leg').forEach(el=>el.addEventListener('click',()=>selectLeg(+el.dataset.i)));
  pb.querySelectorAll('.pl').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.id;map.flyTo(ll(id),Math.max(map.getZoom(),16),{duration:.8});setTimeout(()=>openPop(id),850);}));
  day._legs=legs;
}
function legRow(l,i){
  const line=l.line?`<span class="ln" style="background:${(LINE[l.line]||LINE.WALK).c}">${l.line}</span>`:'';
  const walk=(l.mode==='walk'&&l.from!==l.to)?`<div class="walkinfo">${walkTxt(l.from,l.to)}</div>`:'';
  return `<div class="leg" data-i="${i}"><div class="t">${l.t}<small>${l.ph==='day'?'☀ day':'☾ night'}</small></div>
    <div><div class="h"><span class="md">${MODEICON[l.mode]||''}</span>${line}<span>${l.h}</span></div>
    <div class="r">${l.r||''}</div>${walk}
    ${l.fx?`<div class="fx">${l.fx.map(f=>`<span class="${/LAST|⚠|last back|last off|LAST/i.test(f)?'hot':(/BOOKED|✓/.test(f)?'ok':'')}">${f}</span>`).join('')}</div>`:''}
    ${l.alt?`<div class="alt">${l.alt}</div>`:''}</div></div>`;
}
function selectLeg(i){
  const day=DAYS.find(d=>d.id===state.day); const legs=day._legs||[]; const l=legs[i]; if(!l)return;
  state.activeLeg=i;
  document.querySelectorAll('.leg').forEach(el=>{el.classList.toggle('on',+el.dataset.i===i);el.classList.toggle('dimmed',+el.dataset.i!==i);});
  legs.forEach((x,j)=>{ if(x._pl)x._pl.setStyle({...lineStyle(x.line,j===i),opacity:j===i?.98:.25}); if(x._alt)x._alt.setStyle({...lineStyle('TAXI',j===i),opacity:j===i?.9:.2}); });
  document.querySelectorAll('.pin').forEach(p=>{const id=p.dataset.id;const on=(id===l.from||id===l.to||id===l.altfrom||id===l.altto);p.classList.toggle('hl',on);p.classList.toggle('dim',!on);});
  const b=[];
  if(l._pl)b.push(...l._pl.getLatLngs()); if(l._alt)b.push(...l._alt.getLatLngs()); b.push(L.latLng(ll(l.from)),L.latLng(ll(l.to)));
  map.fitBounds(L.latLngBounds(b),{paddingTopLeft:[40,40],paddingBottomRight:[40,40],maxZoom:16});
  document.getElementById('legs')?.querySelector(`.leg[data-i="${i}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'});
}
map.on('click',()=>{ // clear selection
  if(state.activeLeg===null)return; state.activeLeg=null;
  document.querySelectorAll('.leg').forEach(el=>{el.classList.remove('on','dimmed');});
  document.querySelectorAll('.pin').forEach(p=>p.classList.remove('hl','dim'));
  const day=DAYS.find(d=>d.id===state.day);(day._legs||[]).forEach(x=>{if(x._pl)x._pl.setStyle(lineStyle(x.line,false));if(x._alt)x._alt.setStyle(lineStyle('TAXI',false));});
});

/* ---------- controls ---------- */
const daysEl=document.getElementById('days');
DAYS.forEach(d=>{const b=document.createElement('button');b.className='chip'+(d.id==='ov'?' on':'');b.dataset.id=d.id;b.innerHTML=d.chip+(d.b?`<b>${d.b}</b>`:'');b.addEventListener('click',()=>{state.day=d.id;state.activeLeg=null;render();});daysEl.appendChild(b);});
document.querySelectorAll('#phase button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#phase button').forEach(x=>x.classList.toggle('on',x===b));
  state.phase=b.dataset.p;
  const night=state.phase==='night';
  document.body.classList.toggle('night',night);
  if(night){map.removeLayer(tileLight);tileDark.addTo(map);}else{map.removeLayer(tileDark);tileLight.addTo(map);}
  state.activeLeg=null;render();
}));
document.getElementById('grab').addEventListener('click',()=>{document.getElementById('panel').classList.toggle('tall');setTimeout(()=>map.invalidateSize(),300);});
window.addEventListener('resize',()=>map.invalidateSize());
function zoomClass(){const z=map.getZoom();document.body.classList.toggle('z-low',z<13&&state.day==='ov');document.body.classList.toggle('z-vlow',z<11.5&&state.day==='ov');}
map.on('zoomend',zoomClass);
render();
</script>
</body>
</html>
