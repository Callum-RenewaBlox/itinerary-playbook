# Matches the default page (Ibiza), so there is no flash of the wrong colour
# on load and nothing pale bleeds around the edges. Each itinerary re-themes
# the surrounding chrome to its own palette when it renders.
[theme]
base = "dark"
backgroundColor = "#06050A"
secondaryBackgroundColor = "#100D19"
primaryColor = "#FF2E8B"
textColor = "#FFF6FA"

[browser]
gatherUsageStats = false

[server]
headless = true
enableStaticServing = true
